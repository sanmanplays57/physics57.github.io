<h1>Products in topology</h1>

<p>Three ways of multiplying two spaces together, and what each does to a pair
of circles.</p>

<figure>
    <div class="video-frame">
        <video src="products_in_topology.mp4?v=1" autoplay muted loop playsinline></video>
    </div>
    <figcaption>
        The Cartesian product $X \times Y$ hangs a whole copy of $Y$ over every
        point of $X$: a circle over every point of a circle closes up into the
        torus. The wedge $X \vee Y$ instead glues the two at a single point,
        giving the figure eight. The smash $X \wedge Y$ is the first divided by
        the second &mdash; so inside the torus, a longitude and a meridian
        meeting at one point are collapsed away, which pinches the tube shut and
        then closes the hole, leaving the sphere.
    </figcaption>
</figure>
