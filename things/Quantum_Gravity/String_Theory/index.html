<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>String Theory</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&display=swap');
    </style>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* Fallback background on <html>. A negative z-index canvas paints
           behind its PARENT's background, so an opaque background on <body>
           would hide the canvas -- keep it on <html>. */
        html {
            background: #05070f;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: -1;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .content {
            position: relative;
            max-width: 700px;
            margin: 40px auto;
            padding: 30px 40px;
            background: rgba(15, 20, 35, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            font-family: Georgia, serif;
            opacity: 0;
            animation: fadeInUp 0.9s ease-out forwards;
        }

        .content h1,
        .content ul li,
        .content > p {
            opacity: 0;
            animation: fadeInUp 0.7s ease-out forwards;
        }

        .content h1 { animation-delay: 0.35s; }
        .content ul li:nth-child(1) { animation-delay: 0.55s; }
        .content ul li:nth-child(2) { animation-delay: 0.7s; }
        .content ul li:nth-child(3) { animation-delay: 0.85s; }
        .content ul li:nth-child(4) { animation-delay: 1.0s; }
        .content > p { animation-delay: 1.15s; }

        @media (prefers-reduced-motion: reduce) {
            .content,
            .content h1,
            .content ul li,
            .content > p {
                animation: none;
                opacity: 1;
            }
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            letter-spacing: 0.1em;
            color: #FFFFFF;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 0, 0, 0.5);
        }

        p, li {
            color: #E8EEF7;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        a { color: #79D4FF; }
        a:hover { color: #B7EBFF; }

    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="../../../sky.css">
</head>

<body>

<canvas id="bg-canvas"></canvas>

<div class="content">

<h1>String Theory</h1>

<ul>
<li><a href="String_Pheno/">String Pheno</a></li>
<li><a href="Microstate_counting/">Microstate counting</a></li>
<li><a href="Strings_on_AdS3/">Strings on AdS<sub>3</sub></a></li>
<li><a href="Worldsheet_theory/">Worldsheet theory</a></li>
</ul>

<p><a href="../">← Back to Quantum Gravity</a></p>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { ParametricGeometry } from 'three/addons/geometries/ParametricGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const TAU = Math.PI * 2;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- Renderer / scene / camera ------------------------------------------
const canvas = document.getElementById('bg-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x05070f, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, 0.00035);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 3000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 0.6;

// --- A soft radial-gradient sprite, reused for stars / nodes ------------
function glowTexture() {
    const s = 128;
    const c = document.createElement('canvas');
    c.width = c.height = s;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.2, 'rgba(255,255,255,0.85)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.25)');
    g.addColorStop(1.0, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
const glow = glowTexture();

// --- Palette (weighted colour picker) -----------------------------------
const palette = [
    new THREE.Color(0x8fd4ff), // cyan
    new THREE.Color(0x6f8bff), // blue
    new THREE.Color(0xb488ff), // violet
    new THREE.Color(0xffb060), // warm orange
    new THREE.Color(0xffffff)  // white
];
const weights = [0.34, 0.28, 0.16, 0.12, 0.10];
function pickColor() {
    let r = Math.random(), acc = 0;
    for (let i = 0; i < weights.length; i++) {
        acc += weights[i];
        if (r <= acc) return palette[i];
    }
    return palette[0];
}

// --- Iconic (upright) Klein bottle immersion ----------------------------
// Classic parametrization: the neck bends over and passes through the wall.
function klein(u, v, target) {
    u *= TAU;
    v *= TAU;
    const cu = Math.cos(u), su = Math.sin(u);
    const cv = Math.cos(v), sv = Math.sin(v);
    const r = 4 * (1 - cu / 2);
    let x, y;
    if (u < Math.PI) {
        x = 6 * cu * (1 + su) + r * cu * cv;
        y = 16 * su + r * su * cv;
    } else {
        x = 6 * cu * (1 + su) - r * cv;
        y = 16 * su;
    }
    const z = r * sv;
    target.set(x, y, z);
}

const bottle = new THREE.Group();
scene.add(bottle);

// Smooth translucent shell
const shellGeo = new ParametricGeometry(klein, 240, 60);
shellGeo.center();
const shellMat = new THREE.MeshStandardMaterial({
    color: 0x3a5ea8,
    emissive: 0x142a5c,
    metalness: 0.2,
    roughness: 0.4,
    transparent: true,
    opacity: 0.3,
    side: THREE.DoubleSide,
    depthWrite: false
});
bottle.add(new THREE.Mesh(shellGeo, shellMat));

// Cosmic-web filament network (wireframe of a coarser grid)
const netGeo = new ParametricGeometry(klein, 96, 26);
netGeo.center();
const wire = new THREE.WireframeGeometry(netGeo);
const wireMat = new THREE.LineBasicMaterial({
    color: 0x5fa8ff,
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});
bottle.add(new THREE.LineSegments(wire, wireMat));

// Glowing nodes at the network vertices
const nodePos = netGeo.attributes.position;
const nodeColors = [];
for (let i = 0; i < nodePos.count; i++) {
    const c = pickColor();
    nodeColors.push(c.r, c.g, c.b);
}
const nodeGeo = new THREE.BufferGeometry();
nodeGeo.setAttribute('position', nodePos.clone());
nodeGeo.setAttribute('color', new THREE.Float32BufferAttribute(nodeColors, 3));
const nodeMat = new THREE.PointsMaterial({
    size: 1.1,
    map: glow,
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
});
bottle.add(new THREE.Points(nodeGeo, nodeMat));

// Tilt for a pleasing 3/4 view
bottle.rotation.z = 0.28;
bottle.rotation.x = -0.15;

// Auto-fit the camera to the geometry so it's always framed & centered
shellGeo.computeBoundingSphere();
const fitR = shellGeo.boundingSphere.radius;
const fovR = camera.fov * Math.PI / 180;
const dist = (fitR / Math.sin(fovR / 2)) * 1.25;
camera.position.set(0, fitR * 0.15, dist);
controls.target.set(0, 0, 0);
controls.minDistance = dist * 0.5;
controls.maxDistance = dist * 2.2;
controls.update();

// --- Lighting -----------------------------------------------------------
scene.add(new THREE.AmbientLight(0x404a6a, 1.2));
const key = new THREE.PointLight(0x88bbff, 400, 0, 2);
key.position.set(40, 30, 50);
scene.add(key);
const rim = new THREE.PointLight(0xff9a55, 250, 0, 2);
rim.position.set(-45, -20, -30);
scene.add(rim);

// --- Deep-space backdrop: starfield ------------------------------------
function starfield(count, rMin, rMax) {
    const pos = [], col = [];
    for (let i = 0; i < count; i++) {
        const r = rMin + Math.random() * (rMax - rMin);
        const th = Math.acos(2 * Math.random() - 1);
        const ph = Math.random() * TAU;
        pos.push(
            r * Math.sin(th) * Math.cos(ph),
            r * Math.sin(th) * Math.sin(ph),
            r * Math.cos(th)
        );
        const c = pickColor();
        const b = 0.5 + Math.random() * 0.5;
        col.push(c.r * b, c.g * b, c.b * b);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    return g;
}
const stars = new THREE.Points(starfield(7000, 300, 1700), new THREE.PointsMaterial({
    size: 1.8, map: glow, vertexColors: true, transparent: true,
    opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(stars);

const farStars = new THREE.Points(starfield(6000, 1200, 2600), new THREE.PointsMaterial({
    size: 3.5, map: glow, vertexColors: true, transparent: true,
    opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
}));
scene.add(farStars);

// Soft nebula clouds
const nebulaColors = [0x1b2f66, 0x3a1f5c, 0x5c2a1f, 0x14324d];
const nebulae = new THREE.Group();
for (let i = 0; i < 7; i++) {
    const spriteMat = new THREE.SpriteMaterial({
        map: glow,
        color: nebulaColors[i % nebulaColors.length],
        transparent: true,
        opacity: 0.16 + Math.random() * 0.12,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });
    const s = new THREE.Sprite(spriteMat);
    const R = 350 + Math.random() * 500;
    const th = Math.acos(2 * Math.random() - 1);
    const ph = Math.random() * TAU;
    s.position.set(
        R * Math.sin(th) * Math.cos(ph),
        R * Math.sin(th) * Math.sin(ph),
        R * Math.cos(th)
    );
    const scale = 250 + Math.random() * 350;
    s.scale.set(scale, scale, 1);
    nebulae.add(s);
}
scene.add(nebulae);

// --- Post-processing: bloom for the cinematic glow ----------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.7,   // strength
    0.6,   // radius
    0.2    // threshold
);
composer.addPass(bloom);

// --- Resize / animate ---------------------------------------------------
addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    if (!reduceMotion) {
        bottle.rotation.z = 0.28 + Math.sin(t * 0.25) * 0.05;
        stars.rotation.y = t * 0.006;
        farStars.rotation.y = t * 0.004;
        nebulae.rotation.y = -t * 0.004;
    }
    controls.update();
    composer.render();
}
animate();
</script>

</body>
</html>
