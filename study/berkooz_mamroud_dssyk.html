    <figcaption>
        The boundary circle opens into an interval of the same length, carrying
        its four chords with it. Anchors are pinned throughout, so the pairing
        &mdash; and hence which chords cross &mdash; never changes; only the
        shape of each chord deforms, into the rounded arches of the paper's
        right-hand panel. Each dashed cut is then dropped in turn, with a
        <b class="coral">blob</b> at every chord it meets, and the count above
        it is the chord number of that gap. Anchor positions and the pairing
        are those of Fig. 2, and the counts come out as
        $|0\rangle|1\rangle|2\rangle|3\rangle|2\rangle|3\rangle|2\rangle|1\rangle|0\rangle$.
    </figcaption>
